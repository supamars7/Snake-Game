<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stunning Snake Game - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #info h1 {
            font-weight: 300;
            letter-spacing: 4px;
            margin: 0;
            font-size: 2.2rem;
            opacity: 0.9;
        }
        #score {
            position: absolute;
            top: 80px;
            right: 40px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
        }
        #score span {
            color: #ffd700;
            margin-left: 10px;
        }
        #controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: none;
        }
        #controls kbd {
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 8px;
            margin: 0 4px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
            color: #fff;
            font-weight: 600;
        }
        #restart-btn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 40px;
            background: rgba(255, 215, 0, 0.9);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            display: none;
        }
        #restart-btn:hover {
            transform: translateX(-50%) scale(1.05);
            background: #ffd700;
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.6);
        }
        #restart-btn.show {
            display: block;
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 600px) {
            #score { top: 20px; right: 20px; padding: 8px 18px; font-size: 1.2rem; }
            #info h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div id="info"><h1>🐍 3D SNAKE</h1></div>
    <div id="score">🍎 <span id="score-value">0</span></div>
    <div id="controls"><kbd>⬆</kbd> <kbd>⬇</kbd> <kbd>⬅</kbd> <kbd>➡</kbd> &nbsp; or &nbsp; <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></div>
    <button id="restart-btn">↻ PLAY AGAIN</button>

    <!-- Import Three.js and OrbitControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const BOARD_SIZE = 20;          // 20x20 grid
        const CELL_SIZE = 0.9;          // size of each cell (with gap)
        const GAP = 0.1;
        const EFFECTIVE_SIZE = CELL_SIZE + GAP;
        const HALF_BOARD = BOARD_SIZE / 2;
        const SNAKE_INIT = [
            [10, 10],
            [9, 10],
            [8, 10]
        ];
        const MOVE_INTERVAL_MS = 150;

        // --- State ---
        let snake = SNAKE_INIT.map(pos => [...pos]);
        let direction = [1, 0]; // x, y
        let nextDirection = [1, 0];
        let food = [15, 10];
        let score = 0;
        let gameOver = false;
        let gameLoopInterval = null;
        let isGameActive = false;

        // --- DOM refs ---
        const scoreSpan = document.getElementById('score-value');
        const restartBtn = document.getElementById('restart-btn');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0f1a); // deep dark blue/purple

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 14, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.bias = 0.0001;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Controls (allow rotation but with limits) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.rotateSpeed = 0.8;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 8;
        controls.maxDistance = 30;

        // --- Lights ---
        // Ambient
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Main light
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1);
        mainLight.position.set(5, 15, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 15;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 25;
        scene.add(mainLight);

        // Fill light
        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.5);
        fillLight.position.set(-5, 0, 10);
        scene.add(fillLight);

        // Back light
        const backLight = new THREE.DirectionalLight(0xffaa66, 0.3);
        backLight.position.set(0, -5, -10);
        scene.add(backLight);

        // Floating point light
        const pointLight = new THREE.PointLight(0xffaa88, 0.6, 20);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // --- Create Board (visual floor) ---
        const boardGroup = new THREE.Group();
        scene.add(boardGroup);

        // Floor plane with grid texture illusion
        const gridSize = BOARD_SIZE;
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.7,
            metalness: 0.1,
            emissive: new THREE.Color(0x0a0a1a),
            emissiveIntensity: 0.2,
        });
        const floorGeo = new THREE.PlaneGeometry(gridSize + 0.5, gridSize + 0.5);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.6;
        floor.receiveShadow = true;
        boardGroup.add(floor);

        // Grid lines (decorative)
        const gridMat = new THREE.LineBasicMaterial({ color: 0x3a3a5a, transparent: true, opacity: 0.3 });
        for (let i = 0; i <= BOARD_SIZE; i++) {
            const offset = i - HALF_BOARD;
            // X lines
            const geoX = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-HALF_BOARD, -0.55, offset),
                new THREE.Vector3(HALF_BOARD, -0.55, offset)
            ]);
            const lineX = new THREE.Line(geoX, gridMat);
            boardGroup.add(lineX);
            // Z lines
            const geoZ = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(offset, -0.55, -HALF_BOARD),
                new THREE.Vector3(offset, -0.55, HALF_BOARD)
            ]);
            const lineZ = new THREE.Line(geoZ, gridMat);
            boardGroup.add(lineZ);
        }

        // Border glow
        const borderMat = new THREE.LineBasicMaterial({ color: 0x6a6a9a });
        const borderPoints = [
            new THREE.Vector3(-HALF_BOARD, -0.5, -HALF_BOARD),
            new THREE.Vector3( HALF_BOARD, -0.5, -HALF_BOARD),
            new THREE.Vector3( HALF_BOARD, -0.5,  HALF_BOARD),
            new THREE.Vector3(-HALF_BOARD, -0.5,  HALF_BOARD),
            new THREE.Vector3(-HALF_BOARD, -0.5, -HALF_BOARD),
        ];
        const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPoints);
        const borderLine = new THREE.Line(borderGeo, borderMat);
        boardGroup.add(borderLine);

        // --- Helpers for 3D positions ---
        function gridToWorld(row, col, yOffset = 0) {
            const x = col - HALF_BOARD + 0.5;
            const z = row - HALF_BOARD + 0.5;
            return new THREE.Vector3(x, yOffset, z);
        }

        // --- Snake and Food management (3D objects) ---
        const snakeMeshes = [];
        let foodMesh = null;

        // Materials
        const snakeHeadMat = new THREE.MeshStandardMaterial({
            color: 0xffaa44,
            emissive: 0x442200,
            emissiveIntensity: 0.3,
            roughness: 0.3,
            metalness: 0.6
        });
        const snakeBodyMat = new THREE.MeshStandardMaterial({
            color: 0x44ddff,
            emissive: 0x004466,
            emissiveIntensity: 0.2,
            roughness: 0.2,
            metalness: 0.5
        });
        const foodMat = new THREE.MeshStandardMaterial({
            color: 0xff3366,
            emissive: 0x550022,
            emissiveIntensity: 0.5,
            roughness: 0.2,
            metalness: 0.3
        });

        function createSnakeSegment(row, col, isHead = false) {
            const size = CELL_SIZE;
            const geo = new THREE.BoxGeometry(size, size * 0.7, size);
            const mat = isHead ? snakeHeadMat : snakeBodyMat;
            const mesh = new THREE.Mesh(geo, mat);
            const pos = gridToWorld(row, col, 0);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            // Slight random rotation for organic feel (only if not head)
            if (!isHead) {
                mesh.rotation.y = Math.random() * 0.1;
            }
            return mesh;
        }

        function createFoodMesh(row, col) {
            const size = CELL_SIZE * 0.8;
            const geo = new THREE.SphereGeometry(size * 0.6, 24, 24);
            const mesh = new THREE.Mesh(geo, foodMat);
            const pos = gridToWorld(row, col, 0.1);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            // Add a glow aura (small point light or extra mesh) - using a small ring
            const ringGeo = new THREE.TorusGeometry(size * 0.8, 0.03, 8, 20);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xff88aa, emissive: 0x440022, emissiveIntensity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.1;
            mesh.add(ring);
            return mesh;
        }

        // --- Render scene objects ---
        function renderSnake() {
            // Remove old snake meshes
            snakeMeshes.forEach(mesh => scene.remove(mesh));
            snakeMeshes.length = 0;

            if (snake.length === 0) return;

            // Head
            const head = snake[0];
            const headMesh = createSnakeSegment(head[0], head[1], true);
            scene.add(headMesh);
            snakeMeshes.push(headMesh);

            // Body
            for (let i = 1; i < snake.length; i++) {
                const [row, col] = snake[i];
                const mesh = createSnakeSegment(row, col, false);
                // Tint variation based on position
                const t = i / snake.length;
                mesh.material = snakeBodyMat.clone();
                mesh.material.color.setHSL(0.55 + t * 0.2, 0.8, 0.5);
                scene.add(mesh);
                snakeMeshes.push(mesh);
            }
        }

        function renderFood() {
            if (foodMesh) {
                scene.remove(foodMesh);
                foodMesh = null;
            }
            if (food) {
                foodMesh = createFoodMesh(food[0], food[1]);
                scene.add(foodMesh);
            }
        }

        // --- Game logic ---
        function updateGame() {
            if (gameOver) return;

            // Apply queued direction
            direction = [...nextDirection];

            // Calculate new head
            const head = snake[0];
            let newRow = head[0] + direction[1];
            let newCol = head[1] + direction[0];

            // Wrap around? No, we use walls. Check collision with walls.
            if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE) {
                endGame();
                return;
            }

            // Check if food eaten
            const isEating = (newRow === food[0] && newCol === food[1]);

            // Build new snake array
            let newSnake = [];
            newSnake.push([newRow, newCol]);

            // Add rest of the snake (skip tail if not eating)
            const tail = snake[snake.length - 1];
            for (let i = 0; i < snake.length - (isEating ? 0 : 1); i++) {
                newSnake.push(snake[i]);
            }

            // Check collision with itself (new head cannot be in the rest of the body)
            const headStr = `${newRow},${newCol}`;
            const bodyWithoutHead = newSnake.slice(1).map(p => `${p[0]},${p[1]}`);
            if (bodyWithoutHead.includes(headStr)) {
                endGame();
                return;
            }

            // Update snake
            snake = newSnake;

            // Handle food
            if (isEating) {
                score++;
                scoreSpan.textContent = score;
                generateFood();
                // Speed up slightly? Not for this version, keep constant.
            }

            // Re-render
            renderSnake();
            renderFood();

            // Animate food floating (handled in animation loop)
        }

        function generateFood() {
            const maxAttempts = 1000;
            let attempts = 0;
            const snakeSet = new Set(snake.map(p => `${p[0]},${p[1]}`));
            let newFood = null;
            while (attempts < maxAttempts) {
                const r = Math.floor(Math.random() * BOARD_SIZE);
                const c = Math.floor(Math.random() * BOARD_SIZE);
                if (!snakeSet.has(`${r},${c}`)) {
                    newFood = [r, c];
                    break;
                }
                attempts++;
            }
            if (newFood) {
                food = newFood;
            } else {
                // If no free cell, you win! But we treat as game over? For now, just end.
                endGame();
            }
        }

        function endGame() {
            if (gameOver) return;
            gameOver = true;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            isGameActive = false;
            restartBtn.classList.add('show');
            // Flash effect: change background
            scene.background.setHex(0x2a0a1a);
            setTimeout(() => {
                scene.background.setHex(0x0f0f1a);
            }, 300);
        }

        function resetGame() {
            // Clear interval
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            // Reset state
            snake = SNAKE_INIT.map(pos => [...pos]);
            direction = [1, 0];
            nextDirection = [1, 0];
            food = [15, 10];
            score = 0;
            scoreSpan.textContent = '0';
            gameOver = false;
            isGameActive = true;
            restartBtn.classList.remove('show');
            scene.background.setHex(0x0f0f1a);
            
            // Render initial state
            renderSnake();
            renderFood();
            
            // Start loop
            gameLoopInterval = setInterval(updateGame, MOVE_INTERVAL_MS);
        }

        // --- Keyboard controls ---
        function handleKey(e) {
            const key = e.key;
            // Prevent arrow scrolling
            if (key.startsWith('Arrow') || key === 'w' || key === 'W' || key === 'a' || key === 'A' || key === 's' || key === 'S' || key === 'd' || key === 'D') {
                e.preventDefault();
            }

            if (gameOver) return;

            let newDir = null;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = [0, -1];
            else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = [0, 1];
            else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = [-1, 0];
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = [1, 0];
            else return;

            // Prevent 180-degree turns
            const currentDir = direction;
            if (currentDir[0] === -newDir[0] && currentDir[1] === -newDir[1]) {
                return;
            }
            nextDirection = newDir;
        }

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Animate food: floating and rotation
            if (foodMesh) {
                foodMesh.rotation.y += 0.02;
                const floatOffset = Math.sin(Date.now() * 0.003) * 0.08;
                foodMesh.position.y = 0.1 + floatOffset;
            }

            // Animate snake body (slight wave)
            snakeMeshes.forEach((mesh, index) => {
                if (index > 0) {
                    mesh.rotation.z = Math.sin(Date.now() * 0.005 + index * 0.5) * 0.02;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Init ---
        function init() {
            // Set initial food
            food = [15, 10];
            renderSnake();
            renderFood();
            // Start game loop
            isGameActive = true;
            gameLoopInterval = setInterval(updateGame, MOVE_INTERVAL_MS);
            // Keyboard
            window.addEventListener('keydown', handleKey);
            // Restart button
            restartBtn.addEventListener('click', resetGame);
            // Start animation
            animate();
        }

        init();

        // Safety cleanup (not strictly necessary for a single page)
        window.addEventListener('beforeunload', () => {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
        });

        console.log('🐍 3D Snake Game initialized. Use arrow keys or WASD to play.');
    </script>
</body>
</html>
