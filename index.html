<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Stunning Snake Game - Three.js</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        body {
            min-height: 100dvh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 16px;
            box-sizing: border-box;
            text-align: center;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #info h1 {
            font-weight: 300;
            letter-spacing: 4px;
            margin: 0;
            font-size: clamp(1.3rem, 3vw, 2.2rem);
            line-height: 1.2;
            opacity: 0.9;
            word-break: break-word;
        }
        #score {
            position: absolute;
            top: 80px;
            right: 40px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
        }
        #score span {
            color: #ffd700;
            margin-left: 10px;
        }
        #controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: none;
        }
        #controls kbd {
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 8px;
            margin: 0 4px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
            color: #fff;
            font-weight: 600;
        }
        #restart-btn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 40px;
            background: rgba(255, 215, 0, 0.9);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            display: none;
        }
        #restart-btn:hover {
            transform: translateX(-50%) scale(1.05);
            background: #ffd700;
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.6);
        }
        #restart-btn.show {
            display: block;
            animation: fadeInUp 0.5s ease forwards;
        }
        #start-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(4, 6, 20, 0.78);
            backdrop-filter: blur(8px);
            z-index: 30;
        }
        #start-overlay.hidden {
            display: none;
        }
        .overlay-card {
            width: min(92vw, 360px);
            padding: 28px 24px;
            border-radius: 24px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 18px 50px rgba(0,0,0,0.35);
            text-align: center;
            color: #fff;
        }
        .overlay-card h2 {
            margin: 0 0 10px;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }
        .overlay-card p {
            margin: 0 0 18px;
            color: rgba(255,255,255,0.8);
            line-height: 1.5;
        }
        #start-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffd700, #ff8c42);
            color: #191919;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.28);
        }
        #hud-controls {
            position: absolute;
            right: 18px;
            bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 20;
        }
        .hud-btn {
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            padding: 10px 12px;
            background: rgba(10, 14, 28, 0.8);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        .hud-btn:active {
            transform: scale(0.97);
        }
        #pause-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(4, 6, 20, 0.72);
            backdrop-filter: blur(8px);
            z-index: 25;
        }
        #pause-overlay.show {
            display: flex;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Mobile direction pad */
        #direction-pad {
            position: absolute;
            left: 18px;
            bottom: 18px;
            width: 122px;
            height: 122px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 55%, transparent 100%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.25);
            z-index: 18;
            display: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #direction-pad::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px dashed rgba(255,255,255,0.28);
            border-radius: 50%;
        }
        #direction-knob {
            position: absolute;
            width: 42px;
            height: 42px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.35);
            pointer-events: none;
        }
        #direction-pad-label {
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.72);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            #direction-pad {
                display: block;
            }
            #controls {
                display: none;
            }
            #score {
                top: 12px;
                right: 50%;
                transform: translateX(50%);
                padding: 8px 14px;
                font-size: 1rem;
                max-width: calc(100% - 24px);
                box-sizing: border-box;
                text-align: center;
            }
            #info {
                top: 56px;
                padding: 0 12px;
            }
            #info h1 {
                font-size: clamp(1rem, 5vw, 1.35rem);
                letter-spacing: 1.5px;
            }
            #restart-btn {
                bottom: 84px;
                padding: 12px 26px;
                font-size: 1rem;
                width: calc(100% - 32px);
                max-width: 220px;
            }
        }

        /* Touch overlay for capturing gestures */
        #touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            touch-action: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="info"><h1>🐍 3D SNAKE</h1></div>
    <div id="score">🍎 <span id="score-value">0</span></div>
    <div id="controls"><kbd>⬆</kbd> <kbd>⬇</kbd> <kbd>⬅</kbd> <kbd>➡</kbd> &nbsp; or &nbsp; <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></div>
    <button id="restart-btn">↻ PLAY AGAIN</button>
    <div id="hud-controls">
        <button id="pause-btn" class="hud-btn">⏸ Pause</button>
        <button id="zoom-out-btn" class="hud-btn">−</button>
        <button id="zoom-in-btn" class="hud-btn">+</button>
        <button id="fit-view-btn" class="hud-btn">⤢</button>
    </div>
    <div id="start-overlay">
        <div class="overlay-card">
            <h2>Ready to play?</h2>
            <p>Use arrow keys, WASD, or rotate the circular control on mobile to guide the snake.</p>
            <button id="start-btn">▶ START GAME</button>
        </div>
    </div>
    <div id="pause-overlay">
        <div class="overlay-card">
            <h2>Paused</h2>
            <p>Take your time to inspect the board, then resume when ready.</p>
            <button id="resume-btn" class="hud-btn">▶ Resume</button>
        </div>
    </div>
    <div id="direction-pad" aria-label="Direction pad">
        <div id="direction-knob"></div>
        <div id="direction-pad-label">Rotate</div>
    </div>

    <!-- Import Three.js and OrbitControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const BOARD_SIZE = 20;          // 20x20 grid
        const CELL_SIZE = 0.9;          // size of each cell (with gap)
        const GAP = 0.1;
        const EFFECTIVE_SIZE = CELL_SIZE + GAP;
        const HALF_BOARD = BOARD_SIZE / 2;
        const SNAKE_INIT = [
            [10, 10],
            [9, 10],
            [8, 10]
        ];
        const MOVE_INTERVAL_MS = 150;

        // --- State ---
        let snake = SNAKE_INIT.map(pos => [...pos]);
        let direction = [1, 0]; // x, y
        let nextDirection = [1, 0];
        let food = [15, 10];
        let score = 0;
        let gameOver = false;
        let gameLoopInterval = null;
        let isGameActive = false;
        let gameStarted = false;
        let isPaused = false;

        // --- DOM refs ---
        const scoreSpan = document.getElementById('score-value');
        const restartBtn = document.getElementById('restart-btn');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const pauseOverlay = document.getElementById('pause-overlay');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const fitViewBtn = document.getElementById('fit-view-btn');
        const directionPad = document.getElementById('direction-pad');
        const directionKnob = document.getElementById('direction-knob');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0f1a); // deep dark blue/purple

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 14, 18);
        camera.lookAt(0, 0, 0);

        function updateCameraForViewport() {
            const isMobile = window.innerWidth <= 768;
            const targetDistance = isMobile ? 20 : 18;
            const targetHeight = isMobile ? 16 : 14;
            camera.position.set(targetDistance, targetHeight, targetDistance);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.bias = 0.0001;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Controls (allow rotation but with limits) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.rotateSpeed = 0.8;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 8;
        controls.maxDistance = 30;

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1);
        mainLight.position.set(5, 15, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 15;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 25;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.5);
        fillLight.position.set(-5, 0, 10);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffaa66, 0.3);
        backLight.position.set(0, -5, -10);
        scene.add(backLight);

        const pointLight = new THREE.PointLight(0xffaa88, 0.6, 20);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // --- Create Board (visual floor) ---
        const boardGroup = new THREE.Group();
        scene.add(boardGroup);

        const gridSize = BOARD_SIZE;
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.7,
            metalness: 0.1,
            emissive: new THREE.Color(0x0a0a1a),
            emissiveIntensity: 0.2,
        });
        const floorGeo = new THREE.PlaneGeometry(gridSize + 0.5, gridSize + 0.5);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.6;
        floor.receiveShadow = true;
        boardGroup.add(floor);

        const gridMat = new THREE.LineBasicMaterial({ color: 0x3a3a5a, transparent: true, opacity: 0.3 });
        for (let i = 0; i <= BOARD_SIZE; i++) {
            const offset = i - HALF_BOARD;
            const geoX = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-HALF_BOARD, -0.55, offset),
                new THREE.Vector3(HALF_BOARD, -0.55, offset)
            ]);
            const lineX = new THREE.Line(geoX, gridMat);
            boardGroup.add(lineX);
            const geoZ = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(offset, -0.55, -HALF_BOARD),
                new THREE.Vector3(offset, -0.55, HALF_BOARD)
            ]);
            const lineZ = new THREE.Line(geoZ, gridMat);
            boardGroup.add(lineZ);
        }

        const borderMat = new THREE.LineBasicMaterial({ color: 0x6a6a9a });
        const borderPoints = [
            new THREE.Vector3(-HALF_BOARD, -0.5, -HALF_BOARD),
            new THREE.Vector3( HALF_BOARD, -0.5, -HALF_BOARD),
            new THREE.Vector3( HALF_BOARD, -0.5,  HALF_BOARD),
            new THREE.Vector3(-HALF_BOARD, -0.5,  HALF_BOARD),
            new THREE.Vector3(-HALF_BOARD, -0.5, -HALF_BOARD),
        ];
        const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPoints);
        const borderLine = new THREE.Line(borderGeo, borderMat);
        boardGroup.add(borderLine);

        // --- Helpers for 3D positions ---
        function gridToWorld(row, col, yOffset = 0) {
            const x = col - HALF_BOARD + 0.5;
            const z = row - HALF_BOARD + 0.5;
            return new THREE.Vector3(x, yOffset, z);
        }

        // --- Snake and Food management (3D objects) ---
        const snakeMeshes = [];
        let foodMesh = null;

        const snakeHeadMat = new THREE.MeshStandardMaterial({
            color: 0xffaa44,
            emissive: 0x442200,
            emissiveIntensity: 0.3,
            roughness: 0.3,
            metalness: 0.6
        });
        const snakeBodyMat = new THREE.MeshStandardMaterial({
            color: 0x44ddff,
            emissive: 0x004466,
            emissiveIntensity: 0.2,
            roughness: 0.2,
            metalness: 0.5
        });
        const foodMat = new THREE.MeshStandardMaterial({
            color: 0xff3366,
            emissive: 0x550022,
            emissiveIntensity: 0.5,
            roughness: 0.2,
            metalness: 0.3
        });

        function createSnakeSegment(row, col, isHead = false) {
            const size = CELL_SIZE;
            const geo = new THREE.BoxGeometry(size, size * 0.7, size);
            const mat = isHead ? snakeHeadMat : snakeBodyMat;
            const mesh = new THREE.Mesh(geo, mat);
            const pos = gridToWorld(row, col, 0);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            if (!isHead) {
                mesh.rotation.y = Math.random() * 0.1;
            }
            return mesh;
        }

        function createFoodMesh(row, col) {
            const size = CELL_SIZE * 0.8;
            const geo = new THREE.SphereGeometry(size * 0.6, 24, 24);
            const mesh = new THREE.Mesh(geo, foodMat);
            const pos = gridToWorld(row, col, 0.1);
            mesh.position.copy(pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            const ringGeo = new THREE.TorusGeometry(size * 0.8, 0.03, 8, 20);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xff88aa, emissive: 0x440022, emissiveIntensity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.1;
            mesh.add(ring);
            return mesh;
        }

        // --- Render scene objects ---
        function renderSnake() {
            snakeMeshes.forEach(mesh => scene.remove(mesh));
            snakeMeshes.length = 0;

            if (snake.length === 0) return;

            const head = snake[0];
            const headMesh = createSnakeSegment(head[0], head[1], true);
            scene.add(headMesh);
            snakeMeshes.push(headMesh);

            for (let i = 1; i < snake.length; i++) {
                const [row, col] = snake[i];
                const mesh = createSnakeSegment(row, col, false);
                const t = i / snake.length;
                mesh.material = snakeBodyMat.clone();
                mesh.material.color.setHSL(0.55 + t * 0.2, 0.8, 0.5);
                scene.add(mesh);
                snakeMeshes.push(mesh);
            }
        }

        function renderFood() {
            if (foodMesh) {
                scene.remove(foodMesh);
                foodMesh = null;
            }
            if (food) {
                foodMesh = createFoodMesh(food[0], food[1]);
                scene.add(foodMesh);
            }
        }

        // --- Game logic ---
        function updateGame() {
            if (gameOver || !gameStarted || isPaused) return;

            direction = [...nextDirection];

            const head = snake[0];
            let newRow = head[0] + direction[1];
            let newCol = head[1] + direction[0];

            if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE) {
                endGame();
                return;
            }

            const isEating = (newRow === food[0] && newCol === food[1]);

            let newSnake = [];
            newSnake.push([newRow, newCol]);

            for (let i = 0; i < snake.length - (isEating ? 0 : 1); i++) {
                newSnake.push(snake[i]);
            }

            const headStr = `${newRow},${newCol}`;
            const bodyWithoutHead = newSnake.slice(1).map(p => `${p[0]},${p[1]}`);
            if (bodyWithoutHead.includes(headStr)) {
                endGame();
                return;
            }

            snake = newSnake;

            if (isEating) {
                score++;
                scoreSpan.textContent = score;
                generateFood();
            }

            renderSnake();
            renderFood();
        }

        function generateFood() {
            const maxAttempts = 1000;
            let attempts = 0;
            const snakeSet = new Set(snake.map(p => `${p[0]},${p[1]}`));
            let newFood = null;
            while (attempts < maxAttempts) {
                const r = Math.floor(Math.random() * BOARD_SIZE);
                const c = Math.floor(Math.random() * BOARD_SIZE);
                if (!snakeSet.has(`${r},${c}`)) {
                    newFood = [r, c];
                    break;
                }
                attempts++;
            }
            if (newFood) {
                food = newFood;
            } else {
                endGame();
            }
        }

        function endGame() {
            if (gameOver) return;
            gameOver = true;
            gameStarted = false;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            isGameActive = false;
            restartBtn.classList.add('show');
            startOverlay.classList.remove('hidden');
            scene.background.setHex(0x2a0a1a);
            setTimeout(() => {
                scene.background.setHex(0x0f0f1a);
            }, 300);
        }

        function startGame() {
            if (gameStarted && !gameOver) return;
            gameStarted = true;
            gameOver = false;
            isPaused = false;
            isGameActive = true;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            snake = SNAKE_INIT.map(pos => [...pos]);
            direction = [1, 0];
            nextDirection = [1, 0];
            food = [15, 10];
            score = 0;
            scoreSpan.textContent = '0';
            restartBtn.classList.remove('show');
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.remove('show');
            pauseBtn.textContent = '⏸ Pause';
            scene.background.setHex(0x0f0f1a);
            renderSnake();
            renderFood();
            gameLoopInterval = setInterval(updateGame, MOVE_INTERVAL_MS);
        }

        function resetGame() {
            startGame();
        }

        function togglePause() {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                pauseOverlay.classList.add('show');
                pauseBtn.textContent = '▶ Resume';
            } else {
                pauseOverlay.classList.remove('show');
                pauseBtn.textContent = '⏸ Pause';
                gameLoopInterval = setInterval(updateGame, MOVE_INTERVAL_MS);
            }
        }

        function zoomCamera(delta) {
            const zoomFactor = delta > 0 ? 1.1 : 0.9;
            controls.dollyIn(zoomFactor);
            controls.update();
        }

        function fitView() {
            const distance = 18;
            camera.position.set(distance, distance * 0.95, distance);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- Direction setter (with 180° prevention) ---
        function setDirection(newDir) {
            if (gameOver) return;
            const currentDir = direction;
            if (currentDir[0] === -newDir[0] && currentDir[1] === -newDir[1]) {
                return;
            }
            nextDirection = newDir;
        }

        // --- Keyboard controls ---
        function handleKey(e) {
            const key = e.key;
            if (key.startsWith('Arrow') || key === 'w' || key === 'W' || key === 'a' || key === 'A' || key === 's' || key === 'S' || key === 'd' || key === 'D' || key === ' ' || key === 'Enter') {
                e.preventDefault();
            }
            if (!gameStarted) {
                if (key === 'Enter' || key === ' ' || key === 'Spacebar') {
                    startGame();
                }
                return;
            }
            if (gameOver) return;
            if (key === 'p' || key === 'P') {
                togglePause();
                return;
            }

            let newDir = null;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = [0, -1];
            else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = [0, 1];
            else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = [-1, 0];
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = [1, 0];
            else return;

            setDirection(newDir);
        }

        // --- Mobile rotational direction pad ---
        let joystickActive = false;

        function updateDirectionPad(clientX, clientY) {
            const rect = directionPad.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const radius = rect.width / 2 - 24;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            const distance = Math.min(Math.hypot(dx, dy), radius);
            const angle = Math.atan2(dy, dx);
            const knobX = Math.cos(angle) * distance;
            const knobY = Math.sin(angle) * distance;
            directionKnob.style.transform = `translate(-50%, -50%) translate(${knobX}px, ${knobY}px)`;

            if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) {
                return;
            }

            let newDir = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                newDir = dx > 0 ? [1, 0] : [-1, 0];
            } else {
                newDir = dy > 0 ? [0, 1] : [0, -1];
            }
            setDirection(newDir);
        }

        function handleJoystickStart(e) {
            e.preventDefault();
            if (!gameStarted && !gameOver) {
                startGame();
            }
            if (!gameStarted || gameOver || isPaused) {
                return;
            }
            joystickActive = true;
            directionPad.setPointerCapture(e.pointerId);
            updateDirectionPad(e.clientX, e.clientY);
        }

        function handleJoystickMove(e) {
            if (!joystickActive) return;
            e.preventDefault();
            updateDirectionPad(e.clientX, e.clientY);
        }

        function handleJoystickEnd(e) {
            if (!joystickActive) return;
            e.preventDefault();
            joystickActive = false;
            directionKnob.style.transform = 'translate(-50%, -50%)';
        }

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraForViewport();
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (foodMesh) {
                foodMesh.rotation.y += 0.02;
                const floatOffset = Math.sin(Date.now() * 0.003) * 0.08;
                foodMesh.position.y = 0.1 + floatOffset;
            }

            snakeMeshes.forEach((mesh, index) => {
                if (index > 0) {
                    mesh.rotation.z = Math.sin(Date.now() * 0.005 + index * 0.5) * 0.02;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Init ---
        function init() {
            food = [15, 10];
            renderSnake();
            renderFood();
            isGameActive = false;
            gameStarted = false;
            startOverlay.classList.remove('hidden');
            restartBtn.classList.remove('show');
            
            // Keyboard
            window.addEventListener('keydown', handleKey);
            
            // Mobile rotational direction pad
            directionPad.addEventListener('pointerdown', handleJoystickStart);
            directionPad.addEventListener('pointermove', handleJoystickMove);
            directionPad.addEventListener('pointerup', handleJoystickEnd);
            directionPad.addEventListener('pointercancel', handleJoystickEnd);

            // Start and restart actions
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', resetGame);
            pauseBtn.addEventListener('click', togglePause);
            resumeBtn.addEventListener('click', togglePause);
            zoomOutBtn.addEventListener('click', () => zoomCamera(-1));
            zoomInBtn.addEventListener('click', () => zoomCamera(1));
            fitViewBtn.addEventListener('click', fitView);
            updateCameraForViewport();
            
            animate();
        }

        init();

        window.addEventListener('beforeunload', () => {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
        });

        console.log('🐍 3D Snake Game initialized. Keyboard (Arrow/WASD) and Touch (swipe) supported.');
    </script>
</body>
